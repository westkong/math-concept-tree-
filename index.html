<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 수학 개념 트리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface2: #f0ede6;
      --border: #e2ddd4;
      --accent: #2d6a4f;
      --accent2: #52b788;
      --accent3: #95d5b2;
      --text: #1b1b18;
      --text-muted: #8a8778;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Noto Sans KR', sans-serif; font-weight: 300;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--text); padding: 28px 40px;
      display: flex; align-items: center; gap: 16px;
    }
    .header-icon { font-size: 28px; }
    .header-title { font-size: 20px; font-weight: 700; color: #fff; }
    .header-title span { color: var(--accent3); }
    .header-sub { font-size: 11px; color: #666; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

    .controls {
      max-width: 860px; width: 100%; margin: 0 auto;
      padding: 32px 24px 0; display: flex; flex-direction: column; gap: 16px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }
    .card-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text-muted); letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .api-row { display: flex; gap: 10px; align-items: center; }
    .api-input-wrap { flex: 1; position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 40px 10px 14px; color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .toggle-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
    }
    .api-status {
      font-size: 11px; font-family: 'JetBrains Mono', monospace;
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-muted); white-space: nowrap;
    }
    .api-status.ok { color: var(--accent); border-color: var(--accent); }
    .concept-input-wrap { display: flex; gap: 10px; }
    .concept-input {
      flex: 1; background: var(--surface2); border: 2px solid var(--border);
      border-radius: 10px; padding: 12px 16px; color: var(--text);
      font-family: 'Noto Sans KR', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .concept-input:focus { border-color: var(--accent); }
    .concept-input::placeholder { color: var(--text-muted); }
    .search-btn {
      padding: 12px 24px; background: var(--accent); border: none;
      border-radius: 10px; color: #fff; font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
      white-space: nowrap; display: flex; align-items: center; gap: 8px;
    }
    .search-btn:hover:not(:disabled) { background: #1b4332; transform: translateY(-1px); }
    .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .example-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .example-tag {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px; font-size: 12px;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .example-tag:hover { background: var(--accent3); border-color: var(--accent3); color: #1b4332; }
    .spinner {
      width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      display: none; background: #fff5f5; border: 1px solid #fca5a5;
      border-radius: var(--radius); padding: 12px 16px;
      color: #e63946; font-size: 13px; max-width: 860px;
      width: 100%; margin: 12px auto 0;
    }
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .tree-container {
      flex: 1; display: none; padding: 24px;
      overflow: auto; position: relative; min-height: 500px;
    }
    #treeSvg { width: 100%; height: 100%; min-height: 500px; }

    .node-group { cursor: pointer; }
    .node-circle {
      fill: var(--accent); stroke: #fff; stroke-width: 3;
      transition: all 0.3s; filter: drop-shadow(0 2px 6px rgba(45,106,79,0.3));
    }
    .node-circle.root { fill: var(--text); filter: drop-shadow(0 3px 8px rgba(0,0,0,0.3)); }
    .node-circle.expandable:hover { fill: #1b4332; }
    .node-circle.leaf { fill: var(--accent3); }
    .node-label { font-family: 'Noto Sans KR', sans-serif; font-weight: 500; fill: var(--text); font-size: 13px; }
    .node-sublabel { font-family: 'Noto Sans KR', sans-serif; font-weight: 300; fill: var(--text-muted); font-size: 10px; }
    .node-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #fff; font-weight: 600; }
    .tree-link { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6,4; }

    .legend { display: none; justify-content: center; gap: 20px; padding: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

    /* 상세 정보 패널 */
    .info-panel {
      display: none; max-width: 860px; width: 100%;
      margin: 0 auto; padding: 0 24px 24px;
    }
    .info-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .info-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .info-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .info-name { font-size: 18px; font-weight: 700; }
    .info-level {
      font-size: 11px; color: #fff; background: var(--accent);
      padding: 2px 10px; border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    .info-sections { display: flex; flex-direction: column; gap: 16px; }

    .info-section { }
    .info-section-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text-muted); letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .info-section-content {
      font-size: 14px; line-height: 1.8; color: var(--text);
      background: var(--surface2); border-radius: 8px;
      padding: 14px 16px;
    }
    .info-formula {
      font-size: 15px; line-height: 2;
      background: var(--text); color: #e8e6e0;
      border-radius: 8px; padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
    }
    .info-example {
      font-size: 13px; line-height: 1.8; color: var(--text);
      background: #f0faf4; border: 1px solid var(--accent3);
      border-radius: 8px; padding: 14px 16px;
    }

    .info-loading {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text-muted); padding: 20px 0;
    }
    .info-spinner {
      width: 16px; height: 16px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .info-click-hint {
      font-size: 13px; color: var(--accent); margin-top: 12px;
    }

    footer {
      text-align: center; padding: 16px; font-size: 11px;
      color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid var(--border);
    }
    footer span { color: var(--accent); font-weight: 600; }

    @media (max-width: 480px) {
      .api-row, .concept-input-wrap { flex-direction: column; }
      header { padding: 20px; }
      .controls { padding: 20px 16px 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-icon">🌳</div>
  <div>
    <div class="header-title">수학 개념 <span>트리 탐색기</span></div>
    <div class="header-sub">westkong · math-concept-tree v2 · powered by claude api</div>
  </div>
</header>

<div class="controls">
  <div class="card">
    <div class="card-label">Claude API Key</div>
    <div class="api-row">
      <div class="api-input-wrap">
        <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" />
        <button class="toggle-btn" onclick="toggleKey()">👁</button>
      </div>
      <div class="api-status" id="apiStatus">미입력</div>
    </div>
    <p class="hint">* API 키는 브라우저 내에서만 사용돼요.</p>
  </div>

  <div class="card">
    <div class="card-label">수학 개념 입력</div>
    <div class="concept-input-wrap">
      <input type="text" class="concept-input" id="conceptInput" placeholder="이해하고 싶은 수학 개념을 입력하세요" />
      <button class="search-btn" id="searchBtn" onclick="search()">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">탐색하기</span>
      </button>
    </div>
    <div class="example-row">
      <span class="example-tag" onclick="setExample('미분')">미분</span>
      <span class="example-tag" onclick="setExample('로그')">로그</span>
      <span class="example-tag" onclick="setExample('적분')">적분</span>
      <span class="example-tag" onclick="setExample('극한')">극한</span>
      <span class="example-tag" onclick="setExample('행렬')">행렬</span>
      <span class="example-tag" onclick="setExample('확률')">확률</span>
      <span class="example-tag" onclick="setExample('등차수열')">등차수열</span>
    </div>
  </div>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="legend" id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--text)"></div>목표 개념</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>선수개념 (클릭하여 확장)</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div>하위 선수개념</div>
</div>

<div class="tree-container" id="treeContainer">
  <svg id="treeSvg"></svg>
</div>

<div class="info-panel" id="infoPanel">
  <div class="info-card" id="infoCard"></div>
</div>

<footer>Built by <span>westkong</span> · Math Concept Tree v2 · Powered by Claude API</footer>

<script>
  function toggleKey() {
    const input = document.getElementById('apiKey');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
  document.getElementById('apiKey').addEventListener('input', function() {
    const s = document.getElementById('apiStatus');
    if (this.value.startsWith('sk-ant-')) { s.textContent = '✓ 입력됨'; s.className = 'api-status ok'; }
    else if (this.value.length > 0) { s.textContent = '형식 오류'; s.className = 'api-status err'; }
    else { s.textContent = '미입력'; s.className = 'api-status'; }
  });
  function setExample(c) { document.getElementById('conceptInput').value = c; document.getElementById('conceptInput').focus(); }
  document.getElementById('conceptInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  async function callClaude(apiKey, prompt) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `API 오류 (${res.status})`);
    }
    return (await res.json()).content[0].text.trim();
  }

  let treeData = null;
  let detailCache = {};

  async function search() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const concept = document.getElementById('conceptInput').value.trim();
    if (!apiKey.startsWith('sk-ant-')) { showError('Claude API 키를 입력해주세요.'); return; }
    if (!concept) { showError('수학 개념을 입력해주세요.'); return; }

    const btn = document.getElementById('searchBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true; spinner.style.display = 'block'; btnText.textContent = '분석 중...';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('infoPanel').style.display = 'none';
    detailCache = {};

    try {
      const prompt = `당신은 한국 고등학교 수학 교육과정 전문가입니다.
"${concept}" 개념을 이해하기 위해 반드시 먼저 알아야 할 선수개념 5가지를 중요도 순으로 분석해주세요.
반드시 아래 JSON 형식으로만 응답하세요. JSON 외 다른 텍스트는 절대 포함하지 마세요:
{
  "concept": "${concept}",
  "summary": "${concept}이(가) 무엇인지 한 줄 설명",
  "prerequisites": [
    { "name": "선수개념 이름", "desc": "이 개념이 왜 필요한지 1~2문장 설명", "level": "중1~고3 중 해당 학년" }
  ]
}`;

      const raw = await callClaude(apiKey, prompt);
      const data = JSON.parse(raw.replace(/```json|```/g, '').trim());

      treeData = {
        name: data.concept,
        summary: data.summary,
        level: '목표',
        isRoot: true,
        children: data.prerequisites.map(p => ({
          name: p.name,
          desc: p.desc,
          level: p.level,
          _children: null,
          expanded: false
        }))
      };

      renderTree();

    } catch (err) {
      showError('오류: ' + err.message);
    } finally {
      btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = '탐색하기';
    }
  }

  // ─── D3 트리 렌더링 ───
  function renderTree() {
    const container = document.getElementById('treeContainer');
    const legend = document.getElementById('legend');
    container.style.display = 'block';
    legend.style.display = 'flex';

    const svg = d3.select('#treeSvg');
    svg.selectAll('*').remove();

    const containerRect = container.getBoundingClientRect();
    const width = Math.max(containerRect.width, 700);
    const height = Math.max(500, countNodes(treeData) * 55 + 100);

    svg.attr('width', width).attr('height', height);
    const g = svg.append('g').attr('transform', 'translate(180, 40)');

    const root = d3.hierarchy(treeData);
    d3.tree().size([height - 80, width - 380])(root);

    g.selectAll('.tree-link')
      .data(root.links())
      .join('path')
      .attr('class', 'tree-link')
      .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x))
      .style('opacity', 0)
      .transition().duration(600).delay((d, i) => i * 80)
      .style('opacity', 1);

    const nodes = g.selectAll('.node-group')
      .data(root.descendants())
      .join('g')
      .attr('class', 'node-group')
      .attr('transform', d => `translate(${d.y}, ${d.x})`)
      .style('opacity', 0)
      .on('click', (event, d) => onNodeClick(event, d));

    nodes.transition().duration(500).delay((d, i) => i * 100).style('opacity', 1);

    nodes.append('circle')
      .attr('class', d => {
        if (d.data.isRoot) return 'node-circle root';
        if (d.data._children === null && !d.data.expanded) return 'node-circle expandable';
        return 'node-circle leaf';
      })
      .attr('r', d => d.data.isRoot ? 22 : (d.depth === 1 ? 16 : 12))
      .on('mouseover', function(event, d) {
        if (!d.data.isRoot && !d.data.expanded)
          d3.select(this).transition().duration(200).attr('r', d.depth === 1 ? 20 : 15);
      })
      .on('mouseout', function(event, d) {
        d3.select(this).transition().duration(200).attr('r', d.data.isRoot ? 22 : (d.depth === 1 ? 16 : 12));
      });

    nodes.filter(d => d.depth === 1)
      .append('text').attr('class', 'node-badge')
      .attr('text-anchor', 'middle').attr('dy', '0.35em')
      .text((d, i) => i + 1);

    nodes.filter(d => d.data.isRoot)
      .append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
      .style('font-size', '16px').text('🎯');

    nodes.append('text').attr('class', 'node-label')
      .attr('dy', '-0.2em')
      .attr('x', d => d.data.isRoot ? 32 : (d.children ? -24 : 24))
      .attr('text-anchor', d => d.data.isRoot ? 'start' : (d.children ? 'end' : 'start'))
      .text(d => d.data.name);

    nodes.filter(d => d.data.level && d.data.level !== '목표')
      .append('text').attr('class', 'node-sublabel')
      .attr('dy', '1.2em')
      .attr('x', d => d.children ? -24 : 24)
      .attr('text-anchor', d => d.children ? 'end' : 'start')
      .text(d => d.data.level);

    nodes.filter(d => d.depth === 1 && !d.data.expanded)
      .append('text')
      .attr('dy', '0.35em')
      .attr('x', d => d.children ? -40 : 40)
      .attr('text-anchor', 'middle')
      .style('font-size', '10px').style('fill', 'var(--accent2)')
      .style('font-family', 'JetBrains Mono, monospace')
      .text('+ 클릭');

    const bounds = g.node().getBBox();
    svg.attr('height', Math.max(500, bounds.height + 100));
  }

  function countNodes(data) {
    let count = 1;
    if (data.children) data.children.forEach(c => { count += countNodes(c); });
    return count;
  }

  // ─── 노드 클릭 ───
  async function onNodeClick(event, d) {
    event.stopPropagation();
    const apiKey = document.getElementById('apiKey').value.trim();

    // 상세 정보 패널 표시
    showDetailPanel(d.data, apiKey);

    // 루트 또는 이미 확장됐으면 트리 확장 안 함
    if (d.data.isRoot || d.data.expanded) return;
    if (!apiKey.startsWith('sk-ant-')) return;

    d.data.expanded = true;

    try {
      const prompt = `당신은 한국 고등학교 수학 교육과정 전문가입니다.
"${d.data.name}" 개념의 선수개념 3가지를 알려주세요.
반드시 아래 JSON 형식으로만 응답하세요:
{"prerequisites":[{"name":"개념 이름","desc":"한 줄 설명","level":"학년"}]}`;

      const raw = await callClaude(apiKey, prompt);
      const data = JSON.parse(raw.replace(/```json|```/g, '').trim());

      d.data.children = data.prerequisites.map(p => ({
        name: p.name, desc: p.desc, level: p.level || '', expanded: true
      }));

      renderTree();
    } catch (err) {
      d.data.expanded = false;
    }
  }

  // ─── 상세 정보 패널 ───
  async function showDetailPanel(data, apiKey) {
    const panel = document.getElementById('infoPanel');
    const card = document.getElementById('infoCard');
    panel.style.display = 'block';

    // 캐시 확인
    if (detailCache[data.name]) {
      renderDetail(data, detailCache[data.name]);
      return;
    }

    // 로딩 표시
    card.innerHTML = `
      <div class="info-header">
        <div class="info-dot"></div>
        <div class="info-name">${data.name}</div>
        ${data.level && data.level !== '목표' ? `<div class="info-level">${data.level}</div>` : ''}
      </div>
      <div class="info-loading"><div class="info-spinner"></div>개념 상세 정보 불러오는 중...</div>
    `;

    if (!apiKey || !apiKey.startsWith('sk-ant-')) {
      card.innerHTML += '<div style="color:var(--text-muted);font-size:13px;">API 키를 입력하면 상세 설명을 볼 수 있어요.</div>';
      return;
    }

    try {
      const prompt = `당신은 한국 고등학교 수학 교육과정 전문가이자 수학 강사입니다.
"${data.name}" 개념에 대해 학생이 이해할 수 있도록 설명해주세요.

반드시 아래 JSON 형식으로만 응답하세요. JSON 외 다른 텍스트는 절대 포함하지 마세요:
{
  "definition": "이 개념이 뭔지 쉽게 2~3문장으로 설명",
  "formula": "핵심 공식 또는 표현 (LaTeX 형식, 없으면 빈 문자열)",
  "example": "구체적인 예시 1개 (문제와 풀이 간단하게)",
  "tip": "학생들이 자주 헷갈리는 포인트 1가지"
}`;

      const raw = await callClaude(apiKey, prompt);
      const detail = JSON.parse(raw.replace(/```json|```/g, '').trim());

      detailCache[data.name] = detail;
      renderDetail(data, detail);

    } catch (err) {
      card.innerHTML = `
        <div class="info-header">
          <div class="info-dot"></div>
          <div class="info-name">${data.name}</div>
        </div>
        <div class="info-section">
          <div class="info-section-content">${data.desc || data.summary || '상세 정보를 불러올 수 없어요.'}</div>
        </div>
      `;
    }
  }

  function renderDetail(data, detail) {
    const card = document.getElementById('infoCard');

    let formulaHTML = '';
    if (detail.formula) {
      formulaHTML = `
        <div class="info-section">
          <div class="info-section-label">📐 핵심 공식</div>
          <div class="info-formula">${detail.formula}</div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="info-header">
        <div class="info-dot"></div>
        <div class="info-name">${data.name}</div>
        ${data.level && data.level !== '목표' ? `<div class="info-level">${data.level}</div>` : ''}
      </div>
      <div class="info-sections">
        <div class="info-section">
          <div class="info-section-label">📖 개념 설명</div>
          <div class="info-section-content">${detail.definition}</div>
        </div>
        ${formulaHTML}
        <div class="info-section">
          <div class="info-section-label">✏️ 예시</div>
          <div class="info-example">${detail.example}</div>
        </div>
        <div class="info-section">
          <div class="info-section-label">💡 주의 포인트</div>
          <div class="info-section-content">${detail.tip}</div>
        </div>
      </div>
      ${!data.expanded && !data.isRoot ? '<div class="info-click-hint">↑ 트리의 이 노드를 클릭하면 하위 선수개념이 펼쳐져요</div>' : ''}
    `;

    // MathJax 렌더링
    if (window.MathJax) {
      MathJax.typesetPromise([card]).catch(err => console.error('MathJax:', err));
    }

    // 패널로 스크롤
    document.getElementById('infoPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '⚠ ' + msg; el.style.display = 'block';
  }
</script>
</body>
</html>
